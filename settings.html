<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Page Delay Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 30px;
      min-width: 400px;
      max-width: 600px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ff6600;
    }
    .description {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 30px;
    }
    .groups-container {
      margin-bottom: 20px;
    }
    .group {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .group-title {
      font-size: 16px;
      font-weight: 600;
      color: #ff6600;
    }
    .delete-btn {
      background: transparent;
      color: #ff4444;
      border: 1px solid #ff4444;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      margin: 0;
    }
    .delete-btn:hover {
      background: #ff4444;
      color: white;
    }
    .setting {
      margin-bottom: 15px;
    }
    .setting:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      opacity: 0.9;
    }
    input[type="number"] {
      width: 100px;
      padding: 8px 10px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      background: #1a1a2e;
      color: white;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 13px;
      font-family: monospace;
      border: none;
      border-radius: 5px;
      background: #1a1a2e;
      color: white;
      resize: vertical;
    }
    .hint {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 5px;
    }
    .button-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 20px;
    }
    button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #ff7722;
    }
    .add-btn {
      background: #2d4a7c;
    }
    .add-btn:hover {
      background: #3d5a8c;
    }
    .saved {
      color: #4ade80;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 14px;
    }
    .saved.show {
      opacity: 1;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .empty-state p {
      opacity: 0.6;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>Page Delay Settings</h1>
  <p class="description">Create groups of domains with different delay durations. Pages not in any group will load normally.</p>

  <div class="groups-container" id="groups">
    <!-- Groups will be dynamically inserted here -->
  </div>

  <div class="button-row">
    <button type="button" class="add-btn" id="addGroup">+ Add Group</button>
    <button type="button" id="save">Save Settings</button>
    <span class="saved" id="saved">Saved!</span>
  </div>

  <script src="settings.js"></script>
</body>
</html>
