<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading in...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }
    .container {
      text-align: center;
    }
    .countdown {
      font-size: 150px;
      font-weight: bold;
      color: #ff6600;
      text-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
      animation: pulse 1s ease-in-out infinite;
    }
    .message {
      font-size: 24px;
      margin-top: 20px;
      opacity: 0.8;
    }
    .url {
      font-size: 14px;
      margin-top: 30px;
      opacity: 0.5;
      max-width: 600px;
      word-break: break-all;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="countdown" id="countdown">5</div>
    <div class="message">Loading page in...</div>
    <div class="url" id="url"></div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
